services:
  - type: web
    name: ezkin-frontend
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCK_API
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
