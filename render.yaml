services:
  - type: web
    name: wize-api
    runtime: docker
    plan: free
    region: singapore
    branch: dev
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: AAC_DATABASE_URL
        fromDatabase:
          name: wize-db
          property: connectionString
      - key: AAC_API_PREFIX
        value: /api/v1
      - key: AAC_DEBUG
        value: "false"
      - key: AAC_CORS_ORIGINS
        sync: false

  - type: web
    name: wize-web
    runtime: static
    branch: dev
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_USE_MOCK_API
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: wize-db
    plan: free
    region: singapore
    databaseName: wize
    user: wize
    postgresMajorVersion: "17"
